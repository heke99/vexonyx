rules:
  - id: vexonyx-no-eval
    languages: [javascript, typescript]
    severity: ERROR
    message: Dynamic eval enables code injection. Use explicit parsing/dispatch instead.
    pattern: eval(...)
    metadata:
      category: security
      cwe: CWE-95

  - id: vexonyx-no-dynamic-function-constructor
    languages: [javascript, typescript]
    severity: ERROR
    message: Dynamic Function construction can turn data into executable code.
    pattern: new Function(...)
    metadata:
      category: security
      cwe: CWE-95

  - id: vexonyx-no-public-secret-env-name
    languages: [generic]
    severity: ERROR
    message: A secret-looking environment variable is prefixed NEXT_PUBLIC_ and can be exposed to browser bundles.
    pattern-regex: 'NEXT_PUBLIC_[A-Z0-9_]*(SECRET|PRIVATE_KEY|SERVICE_ROLE|ACCESS_TOKEN|REFRESH_TOKEN|PASSWORD)'
    paths:
      exclude:
        - .agents/**
        - docs/**
    metadata:
      category: secrets
      cwe: CWE-200

  - id: vexonyx-review-shell-exec
    languages: [javascript, typescript]
    severity: WARNING
    message: Shell execution is a high-risk boundary. Verify arguments are not attacker-controlled and prefer execFile/spawn with argument arrays.
    pattern-either:
      - pattern: exec($CMD, ...)
      - pattern: execSync($CMD, ...)
    metadata:
      category: security
      cwe: CWE-78

  - id: vexonyx-review-dangerously-set-inner-html
    languages: [generic]
    severity: WARNING
    message: Review dangerouslySetInnerHTML and prove the value is trusted or sanitized.
    pattern-regex: 'dangerouslySetInnerHTML\s*=\s*\{\{'
    paths:
      include:
        - '*.js'
        - '*.jsx'
        - '*.ts'
        - '*.tsx'
    metadata:
      category: security
      cwe: CWE-79
