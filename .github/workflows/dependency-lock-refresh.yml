name: Dependency lock refresh

on:
  push:
    branches: ["agent/vexonyx-project-auditor"]

permissions:
  contents: write

jobs:
  regenerate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: agent/vexonyx-project-auditor
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: npm
      - name: Use repository-pinned npm
        shell: bash
        run: |
          set -euo pipefail
          npm install --global npm@10.9.2 --no-audit --no-fund
          test "$(npm --version)" = "10.9.2"
      - name: Regenerate package lock only
        shell: bash
        run: |
          set -euo pipefail
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          node - <<'NODE'
          const lock = require('./package-lock.json');
          const postcss = lock.packages?.['node_modules/postcss']?.version;
          const sharp = lock.packages?.['node_modules/sharp']?.version;
          console.log({ postcss, sharp });
          if (postcss !== '8.5.23' || sharp !== '0.35.0') process.exit(1);
          NODE
      - name: Commit only regenerated lockfile
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- package-lock.json; then
            echo "package-lock.json already matches package.json overrides."
            exit 0
          fi
          git diff --exit-code -- . ':!package-lock.json'
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "refresh vulnerable transitive dependency lock"
          git push origin HEAD:agent/vexonyx-project-auditor
