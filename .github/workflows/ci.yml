name: CI
on:
  pull_request:
  push:
    branches: [main, "agent/**"]
permissions:
  contents: read
jobs:
  app:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test
      - name: Isolated parser safety smoke tests
        run: |
          set -euo pipefail
          printf 'authorized security report\n' > /tmp/vexonyx-safe.txt
          python3 services/isolated-parser/parser.py --input /tmp/vexonyx-safe.txt --mime text/plain --name safe.txt | grep '"status":"ready"'
          python3 - <<'PY'
          import zipfile
          with zipfile.ZipFile('/tmp/vexonyx-traversal.zip','w') as z:
              z.writestr('../escape.txt','blocked')
          PY
          set +e
          python3 services/isolated-parser/parser.py --input /tmp/vexonyx-traversal.zip --mime application/zip --name traversal.zip > /tmp/parser-blocked.json
          code=$?
          set -e
          test "$code" -eq 2
          grep '"status":"blocked"' /tmp/parser-blocked.json
      - run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://trwwicnqnudllbeldsib.supabase.co
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_placeholder
          NEXT_PUBLIC_APP_URL: http://localhost:3000
  migration-replay:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npx supabase init || true
      - run: npx supabase start -x studio,imgproxy,edge-runtime,logflare,vector,supavisor
      - run: npx supabase db reset
      - run: npx supabase db lint --level error
      - run: npx supabase test db
      - run: npx supabase status
